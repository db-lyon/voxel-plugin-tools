# Every action is a native handler in ue/Plugins/VoxelPluginTools (Voxel exposes most of
# this to neither Python nor reflection). Actors are addressed by actorPath (stable) or
# actorLabel; rotations are {pitch,yaw,roll}.
actionPrefix: voxel
minServerVersion: 1.3.10-beta.13
uePluginDependency: Voxel
nativeModule:
  uePluginName: VoxelPluginTools
  minBridgeApi: 2
  supportedEngineVersions:
    - '5.8'
  source: ue/Plugins/VoxelPluginTools
  category: voxel
  categoryDescription: 'Voxel Plugin 2: worlds, stamps, sculpting, layer queries, voxel assets, voxel PCG nodes, and graph authoring'
  specs: handler-specs.json
  handlers:
    voxel_shader_hooks_status:
      effect: read
      description: >-
        Report whether Voxel's engine shader hooks are applied: allActive, each hook group's state, and the pending hooks. Voxel materials render only with them; without them terrain
        shows the grid fallback with no error, and the result carries the fix. Run before any material work.
    voxel_world_spawn:
      effect: mutate
      description: >-
        Spawn an AVoxelWorld in the editor's current level (undoable, selected like a drag-in), optionally setting layerStack, megaMaterial and voxelSize through the details-panel edit path;
        every other world setting goes through voxel_world_configure. Refused during PIE. Returns the actor, each applied field with previous/value/changed, and runtimeCreated.
    voxel_world_configure:
      effect: mutate
      description: >-
        Set AVoxelWorld properties through PreEditChange/PostEditChangeProperty, as a details-panel edit does, in one undoable transaction. All values are validated before anything changes; unknown
        fields are errors. Object fields take an asset path, or an empty string to clear. Returns previous/value/changed per field and an overall changed.
    voxel_world_status:
      effect: read
      description: 'Read a voxel world''s runtime state and core config: runtimeCreated, isReady, processingNewState, progress (0..1), pendingTasks, layerStack, megaMaterial, voxelSize.'
    voxel_world_runtime:
      effect: mutate
      description: >-
        Create or destroy a voxel world's runtime (transient, not undoable). In the editor any construction-script rerun, such as moving or editing the world, recreates a destroyed runtime. Returns
        runtimeCreated and changed.
    voxel_actor_spawn:
      effect: mutate
      description: >-
        Spawn a stamp, height or volume sculpt, collision baker or debug actor in the editor's current level (undoable; refused during PIE). Stamp actors treat the label as a prefix and
        append their stamp description, so key later calls on the returned actorPath.
    voxel_component_add:
      effect: mutate
      description: >-
        Add a Voxel component to an actor as an instance component, the way the editor's Add Component does: attached to the root (or made the root when there is none), registered, undoable. Returns
        componentName, componentClass and isRoot.
    voxel_no_clipping_set_layer:
      effect: mutate
      description: >-
        Set a UVoxelNoClippingComponent's volume layer and/or bAutoAdjustPlayer through the details-panel edit path, undoable. The component samples a volume layer, so layer must be a
        UVoxelVolumeLayer; an omitted stack or layer defaults to Voxel's built-in default. Returns previous/value/changed per field.
    voxel_stamp_set:
      effect: mutate
      description: >-
        Set the stamp on a stamp actor's UVoxelStampComponent, building the stamp struct for the given kind; unspecified fields keep their values when the component already holds a stamp of that kind,
        another kind is replaced (replacedKind), and the component transform places the stamp. Pointing a graph kind at another graph clears its parameter overrides (overridesReset). Returns the
        stamp read-back.
    voxel_stamp_read:
      effect: read
      description: 'Read a stamp actor''s UVoxelStampComponent stamp: kind, struct, asset, layer, blend mode, priority, smoothness, behavior, kind-specific fields and enabled graph parameter overrides.'
    voxel_instanced_stamps:
      effect: mutate
      description: >-
        Add, remove, clear, update (re-evaluate) or count the stamps on an actor's UVoxelInstancedStampComponent (add one with voxel_component_add). add takes the same stamp fields as
        voxel_stamp_set (spline kinds excluded) plus one transform per instance, world space unless relativeToComponent; remove empties a slot, so indices never shift. Returns count,
        validCount and, with includeStamps, every stamp with its index and transform.
    voxel_spline_read:
      effect: read
      description: >-
        Read the UVoxelSplineComponent a height_spline or volume_spline stamp reads: every point (location relative to the component and in world space, type, tangents, rotation, scale),
        closedLoop, length, the stamp graph, and each spline parameter's per-point metadata values with its type and default.
    voxel_spline_set_points:
      effect: mutate
      description: >-
        Replace the curve of a spline stamp's UVoxelSplineComponent (core set_spline_points refuses Voxel's spline, which carries per-point metadata): points relative to the component, optional
        closedLoop, and per-point values for the stamp graph's spline parameters. Everything is validated before the edit, which is one undoable transaction and rebuilds the stamp. Returns the
        spline as voxel_spline_read does.
    voxel_height_sculpt:
      effect: mutate
      description: >-
        Sculpt, flatten, smooth, paint, apply a sculpt graph to, or clear an AVoxelSculptHeight actor through Voxel's sculpt API; undoable, waits for completion unless wait=false (then reports
        queued). Defaults per op match Voxel's library (radius 500, smooth 1000; strength sculpt_height 0.5, smooth 1, paint 0.05).
      timeoutSeconds: 600
    voxel_volume_sculpt:
      effect: mutate
      description: >-
        Edit an AVoxelSculptVolume actor with Voxel's volume sculpt ops (sphere, cube, flatten, smooth, surface, angle, paint, sculpt graph) or clear it; undoable, waits for completion unless
        wait=false. Defaults per op match Voxel's library.
      timeoutSeconds: 600
    voxel_sculpt_asset_get:
      effect: read
      description: Report a sculpt actor's kind (height or volume), its external save asset path (null when data is stored in the level), and whether its sculpt data is empty.
    voxel_sculpt_asset_set:
      effect: mutate
      description: >-
        Bind a sculpt actor to an external save asset (UVoxelSculptHeightAsset for height actors, UVoxelSculptVolumeAsset for volume actors) or detach it with an empty asset; undoable. load=true
        adopts the asset's data (an empty asset receives the actor's data); load=false overwrites the asset with the actor's current data.
      timeoutSeconds: 300
    voxel_query_layer:
      effect: read
      description: >-
        Sample a voxel layer in the editor world at up to 4096 points: height (height layers) or signed distance (volume layers, negative inside), normal, optional resolved surface type with
        blend weights, and optional metadata values. Needs no AVoxelWorld; reads the stamps registered in the editor world. Defaults to Voxel's built-in default stack and layer (/Voxel/Default), so pass the
        stack and layer your stamps write to. A point no stamp covers reads null.
      timeoutSeconds: 300
    voxel_export_to_render_target:
      effect: mutate
      description: >-
        Write a height layer region into a UTextureRenderTarget2D via Voxel's ExportVoxelDataToRenderTarget; each channel is height, a constant or a metadata component, sampled over bounds at the
        render target's resolution. Heights need a float format (8-bit formats are rejected); contents are GPU-side and not saved with the asset.
      timeoutSeconds: 300
    voxel_asset_create:
      effect: mutate
      description: >-
        Create a Voxel asset through its own factory (graph types are duplicated from the graph class template, so they start with their output node; function libraries start with a terminal graph).
        An existing asset is never overwritten: by default it is returned with existed: true. instanceOf makes a graph instance of a base graph of the same type. Returns assetPath, class, created,
        existed.
    voxel_asset_set_property:
      effect: mutate
      description: >-
        Set one top-level property on any asset through PreEditChange/PostEditChangeProperty in an undoable transaction. The value is UE import text, validated before the asset changes; object
        references are asset paths that must load, an empty string clears them; arrays use (a,b,c) or a JSON array. Returns previous, value, changed, editable.
    voxel_mega_material_set_surfaces:
      effect: mutate
      description: >-
        Set a UVoxelMegaMaterial's surface type list (replace, or append the entries not already in it) and its settings with details-panel edit semantics, so the generated material rebuilds.
        Returns per-property previous/value, changed, and the resulting surfaceTypes.
    voxel_surface_type_set:
      effect: mutate
      description: Set fields of a UVoxelSurfaceTypeAsset with details-panel edit semantics in one undoable transaction; all values are validated first. Returns per-property previous/value and changed.
    voxel_smart_surface_set:
      effect: mutate
      description: >-
        Set a UVoxelSmartSurfaceType's graph and graph parameter overrides. Values are parsed against the target graph's parameter types before anything changes. Returns graph, the enabled overrides,
        and changed.
    voxel_layer_stack_set:
      effect: mutate
      description: >-
        Set a UVoxelLayerStack's layer lists (replacing each given list, in order) and max distance with details-panel edit semantics. Returns per-property previous/value, the resulting lists and
        maxDistance.
    voxel_pcg_add_node:
      effect: mutate
      description: >-
        Add one of Voxel's PCG nodes (sampler, wait-for-world, query, projection, stamp and spline spawners, voxel graph calls, isolines) to a UPCGGraph via UPCGGraph::AddNodeOfType; engine
        nodes come from pcg add_node. Returns the node name (the nodeName pcg actions take), title, settingsClass and position. An open PCG graph editor shows the node after it is reopened.
    voxel_pcg_configure_sampler:
      effect: mutate
      description: >-
        Configure a Voxel Sampler (sampler) or Voxel Sampler Experimental (sampler_v2) PCG node. Each property is edited through Pre/PostEditChange so the graph regenerates; a field the node's class
        lacks is an error. A new sampler reads Voxel's built-in default volume layer, so set layer to sample height terrain. Returns the node and per-property previous/value.
    voxel_graph_read:
      description: 'Read a voxel graph: terminal graphs, parameters (name, guid, type, default) and every node with pins, defaults and links.'
      effect: read
    voxel_graph_list_node_types:
      description: >-
        List the node types this graph allows (Voxel's node library, function-library nodes, and 'Parameters|<name>' getters) as 'Category|Name' keys for voxel_graph_add_node's nodeType.
        Space-separated query words must all match.
      effect: read
    voxel_graph_add_node:
      description: Add a node by its type key ('Category|Name', or the bare name when unique). Returns the node with its pins.
      effect: mutate
    voxel_graph_connect:
      description: Connect an output pin to an input pin. Nodes by id (GUID), object name or unique title; pins by name or display name.
      effect: mutate
    voxel_graph_disconnect:
      description: Break one link between an output pin and an input pin.
      effect: mutate
    voxel_graph_set_pin_default:
      description: Set an unconnected input pin's default value (pin default text, e.g. '5000', '(X=1,Y=2)').
      effect: mutate
    voxel_graph_delete_node:
      description: Delete a node and its links.
      effect: mutate
    voxel_graph_export_t3d:
      description: Export nodes as clipboard T3D text (all copyable nodes, or the listed ids).
      effect: read
    voxel_graph_import_t3d:
      description: >-
        Paste T3D node text into a voxel graph (new GUIDs, links inside the text kept). Opens the graph editor for the paste if it is closed, since Voxel refuses pastes without it; reports nodes the
        graph type refused.
      effect: mutate
    voxel_graph_add_parameter:
      description: >-
        Add a graph parameter with a type and an optional default, validated before the graph changes. Stamps and instances override it by name. Nothing reads it until its getter is placed:
        voxel_graph_add_node with nodeType 'Parameters|<name>'. Refused on a graph instance.
      effect: mutate
    voxel_graph_remove_parameter:
      description: Remove a graph parameter, its getter nodes in every terminal graph, and its stored default.
      effect: mutate
    voxel_graph_set_parameter_default:
      description: >-
        Set a graph parameter's default value from value text parsed as the parameter's type. On a graph instance this sets the instance's own value for an inherited parameter; the base is
        untouched. Returns every parameter with its default.
      effect: mutate
    voxel_graph_add_function:
      description: >-
        Add a function (a new terminal graph) to a voxel graph or function library, as the members panel does: name, category, description, exposeToLibrary, and its inputs and outputs, each
        placed as a Function Input or Function Output node in the new graph. Returns the function with its terminal graph GUID (the terminalGraph the other graph actions take) and the nodes.
      effect: mutate
    voxel_graph_set_function:
      description: >-
        Rename a function or set its category, description or exposeToLibrary (function libraries only). Refused on an override of a base graph's function, whose base owns these fields.
        Returns previous and current.
      effect: mutate
    voxel_graph_remove_function:
      description: >-
        Remove a function. Refused while any graph calls it (every voxel graph is loaded first to find callers), listing the call nodes to delete; removing an override reverts its callers to the
        base graph's function. Closes the asset's editor if it is open.
      timeoutSeconds: 300
      effect: mutate
    voxel_stamp_set_parameters:
      description: >-
        Override graph parameters on a height_graph or volume_graph stamp by parameter name, merged onto the overrides it already has; every other stamp field is kept. Spline stamps take
        overrides through voxel_stamp_set parameters. Returns every enabled override as the component stored it. Stamp actors relabel themselves from their stamp, so prefer actorPath.
      effect: mutate
knowledge:
  voxel: knowledge/voxel.md
flows: {}
